<!doctype html>
<html lang="en" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SchemaFlow — Visual Database Schema Studio</title>
    <script>
      // Apply the persisted theme before first paint (no flash). Mirrors src/store/useThemeStore.ts.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('schemaflow:theme') || 'null');
          var theme = saved && saved.state && saved.state.theme;
          if (theme === 'carbon' || theme === 'paper') document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
